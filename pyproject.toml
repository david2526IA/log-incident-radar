[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-incident-radar"
version = "0.1.0"
description = "Local JSONL log burst analysis for explainable incident triage."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
log-incident-radar = "log_incident_radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
